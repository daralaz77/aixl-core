receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317          # gRPC ONLY (no HTTP receiver): whatever arrives, arrived over gRPC
exporters:
  debug:
    verbosity: detailed
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
