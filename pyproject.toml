[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aixl"
version = "0.5.0"
description = "AIXL 0.3 - experimental semantic core: canonical semantic representation, equivalence, diff, drift, contradiction and ambiguity detection"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "tiktoken"]
mcp = ["mcp"]
a2a = ["a2a-sdk[http-server]", "uvicorn"]
llm = ["httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["aixl*"]
