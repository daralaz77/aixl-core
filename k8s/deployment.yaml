apiVersion: apps/v1
kind: Deployment
metadata:
  name: aixl-a2a
  namespace: aixl
  labels:
    app: aixl-a2a
spec:
  replicas: 2   # >1 for reliability: a rolling update or a node drain never drops to zero pods
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never go below `replicas` during a deploy — reduces downtime risk
      maxSurge: 1
  selector:
    matchLabels:
      app: aixl-a2a
  template:
    metadata:
      labels:
        app: aixl-a2a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # matches the `aixl` user created in the Dockerfile
      containers:
        - name: aixl-a2a
          image: ghcr.io/daralaz77/aixl-core:latest   # built and published by .github/workflows/docker-publish.yml
          ports:
            - containerPort: 8766
              name: http
          envFrom:
            - configMapRef:
                name: aixl-a2a-config
          resources:
            # A single Python asyncio process doing in-memory comparisons: no large working set, no
            # disk I/O, no external calls. These are deliberately small; raise them only if /metrics
            # or real load testing shows cause.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
