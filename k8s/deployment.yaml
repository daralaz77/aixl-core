apiVersion: apps/v1
kind: Deployment
metadata:
  name: aixl-a2a
  namespace: aixl
  labels:
    app: aixl-a2a
spec:
  # replicas: 1, NOT >1 — found the hard way (DEPLOYMENT.md §8): aixl_negotiate's multi-turn pause/
  # resume state lives in an in-memory, per-pod TaskStore. At replicas: 2 with a plain ClusterIP
  # Service, 12 of 20 real resume attempts failed with TaskNotFoundError because the resume landed on
  # a pod that never saw the original "start" call. Session affinity (service.yaml) fixes the common
  # case but does NOT survive a pod restart/reschedule (confirmed: 0/1 resumes after a real pod
  # restart) — so correctness, not just throughput, requires a single instance until a shared
  # TaskStore exists (see DEPLOYMENT.md §8 for the real options, deliberately not built yet).
  replicas: 1
  strategy:
    type: Recreate   # RollingUpdate's maxSurge would momentarily run 2 pods — the exact bug above
  selector:
    matchLabels:
      app: aixl-a2a
  template:
    metadata:
      labels:
        app: aixl-a2a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # matches the `aixl` user created in the Dockerfile
      # ghcr.io/daralaz77/aixl-core is a PRIVATE package (matches the repo's own visibility) — without
      # this, the kubelet gets a real 403/unauthorized trying to pull it, same as an anonymous
      # `docker pull` does (confirmed for real: this was missing in the first version of this manifest
      # and only surfaced once the image was actually published and something tried to pull it from
      # outside CI's own authenticated context). See DEPLOYMENT.md for how to create this secret.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: aixl-a2a
          image: ghcr.io/daralaz77/aixl-core:latest   # built and published by .github/workflows/docker-publish.yml
          ports:
            - containerPort: 8766
              name: http
          envFrom:
            - configMapRef:
                name: aixl-a2a-config
          resources:
            # A single Python asyncio process doing in-memory comparisons: no large working set, no
            # disk I/O, no external calls. These are deliberately small; raise them only if /metrics
            # or real load testing shows cause.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
