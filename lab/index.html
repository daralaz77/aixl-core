<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIXL Semantic Lab</title>
<style>
:root{--bg:#c9c3b6;--panel:#e8e3d6;--panel2:#d9d3c4;--ink:#2a2620;--mut:#5d564a;--line:#a79f8c;--ok:#1c7a46;--bad:#b3261e;--warn:#9a6700;--acc:#2f4bd8;--paper:#f6f1e3;--hi:rgba(255,255,255,.75);--sh:rgba(40,30,10,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--panel:#34312c;--panel2:#2a2824;--ink:#ece6d8;--mut:#b0a999;--line:#12110f;--ok:#4cc38a;--bad:#ff8a80;--warn:#e3b341;--acc:#8ea2ff;--paper:#23211d;--hi:rgba(255,255,255,.10);--sh:rgba(0,0,0,.6)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg) repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 5px)}
main{max-width:940px;margin:24px auto;padding:26px 22px 40px;background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:18px;border:1px solid var(--line);box-shadow:0 1px 0 var(--hi) inset,0 18px 40px var(--sh),0 2px 0 var(--line)}
@media(max-width:640px){main{margin:10px;padding:18px 14px}}
h1{font-size:22px;margin:0 0 4px;text-shadow:0 1px 0 var(--hi)}p.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.12em;text-shadow:0 1px 0 var(--hi)}
textarea{width:100%;min-height:92px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;resize:vertical;box-shadow:inset 0 3px 7px var(--sh),0 1px 0 var(--hi)}
textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;min-height:40px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);color:var(--ink);cursor:pointer;background:linear-gradient(180deg,var(--hi),transparent 55%),var(--panel);box-shadow:0 1px 0 var(--hi) inset,0 3px 0 var(--line),0 5px 8px var(--sh);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hi) inset,0 0 0 var(--line),0 1px 3px var(--sh)}
button.primary{color:#fff;font-weight:700;letter-spacing:.06em;border-color:#1d2f94;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 55%),var(--acc);text-shadow:0 -1px 0 rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 3px 0 #1d2f94,0 5px 8px var(--sh)}
.demos{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 16px}.demos button{font-size:13px;padding:6px 12px;min-height:36px}
.card{margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);box-shadow:inset 0 2px 8px var(--sh),0 1px 0 var(--hi)}
.bar{height:14px;border-radius:7px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 2px 4px var(--sh)}.bar>i{display:block;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent),var(--acc)}
.badge{display:inline-flex;align-items:center;gap:9px;padding:5px 14px 5px 10px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.03em;border:1px solid var(--line);background:var(--panel);box-shadow:0 1px 0 var(--hi) inset,0 2px 4px var(--sh)}
.badge:before{content:"";width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,currentColor 40%,rgba(0,0,0,.55));box-shadow:0 0 9px currentColor,inset 0 -1px 2px rgba(0,0,0,.4)}
.eq{color:var(--ok)}.neq{color:var(--bad)}.badge.warn{color:var(--warn)}
.dims{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.dim{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);box-shadow:0 1px 0 var(--hi) inset}.dim.ok{color:var(--ok)}.dim.no{color:var(--bad)}
pre{background:#14130f;color:#9be8b3;border:1px solid #000;border-radius:8px;padding:10px;overflow:auto;font-size:12.5px;margin:6px 0;box-shadow:inset 0 3px 8px rgba(0,0,0,.7)}
details{margin-top:14px}summary{cursor:pointer;color:var(--mut);font-size:13px}.err{border-color:var(--bad);color:var(--bad)}
.diff{margin:6px 0;padding:8px 10px;border-radius:6px;border-left:4px solid var(--bad);background:var(--panel);box-shadow:inset 0 1px 3px var(--sh)}small{color:var(--mut)}
</style></head>
<body><main>
<h1>AIXL Semantic Lab</h1>
<p class="sub">¿Dos textos significan lo mismo? Motor local, sin API externa. Es un detector de cambios críticos: solo afirma «equivalente» cuando puede comprobarlo.</p>
<div class="grid"><div><label for="a">TEXTO A</label><textarea id="a">Analiza las ventas del primer trimestre de 2026.</textarea></div>
<div><label for="b">TEXTO B</label><textarea id="b">Examina las ventas de Q1 2026.</textarea></div></div>
<div class="demos" id="demos"></div>
<button class="primary" id="go">COMPARAR</button> <small>Ctrl+Enter</small>
<div id="out" role="status" aria-live="polite"></div>
<script>
const DEMOS=[["Equivalencia","Analiza las ventas del primer trimestre de 2026.","Examina las ventas de Q1 2026."],["Periodo","Analiza las ventas de Q1 2026.","Analiza las ventas de Q2 2026."],["Negación","Elimina el reporte.","No elimines el reporte."],["Cantidad","Analiza 100 registros.","Analiza 1000 registros."],["Restricción","Confianza >= 0.90","Confianza >= 0.70"],["Ambigüedad","Analiza los datos recientes.","Analiza los datos de 2026."],["Sin prueba","Envía el informe a Ana.","Mándale a Ana el informe."]];
const STATES={PROVEN:["eq","EQUIVALENCIA COMPROBADA"],NO_PROOF:["warn","SIN CAMBIOS CRÍTICOS — NO PROBADO EQUIVALENTE"],DIFFERENCE:["neq","DIFERENCIA DETECTADA"],UNVERIFIED:["warn","NO SE PUDO ANALIZAR"]};
const DIMN={actions:"Acción",entities:"Entidades",data:"Datos",time:"Fechas y tiempo",location:"Lugar",constraints:"Restricciones",conditions:"Condiciones",negation:"Negación",references:"Referencias",quantities:"Cantidades",output:"Resultado esperado",modifiers:"Matices"};
const $=id=>document.getElementById(id);
DEMOS.forEach(d=>{const b=document.createElement('button');b.textContent=d[0];b.onclick=()=>{$('a').value=d[1];$('b').value=d[2];run()};$('demos').appendChild(b)});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fail(msg){$('out').innerHTML=`<div class="card err"><b>No se pudo comparar.</b> ${esc(msg)}</div>`}
async function run(){
  $('out').innerHTML='<div class="card">Analizando…</div>';
  let d;
  try{
    const r=await fetch('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:$('a').value,b:$('b').value})});
    d=await r.json(); if(!r.ok) return fail(d.error||('Error '+r.status));
  }catch(e){return fail('Sin conexión con el servidor. Inícialo con: python lab/server.py')}
  const [cls,label]=STATES[d.state]||STATES.UNVERIFIED; const pct=Math.round((d.similarity||0)*100);
  const dims=Object.entries(d.per_dimension).filter(([k,v])=>v!==null&&k!=='intent'&&k!=='goal').map(([k,v])=>`<span class="dim ${v===1?'ok':'no'}">${v===1?'✓':'✗'} ${esc(DIMN[k]||k)}</span>`).join('');
  const rel=(d.relay&&d.relay.violations||[]).map(v=>`<div class="diff"><b>Dato crítico (${esc(v.family)})</b><br>Solo en A: ${esc((v.only_in_source||[]).join(', ')||'—')} → Solo en B: ${esc((v.only_in_relay||[]).join(', ')||'—')}</div>`).join('');
  const diffs=(d.differences||[]).map(x=>`<div class="diff"><b>${esc(x.field)}</b> — ${esc(x.kind)} <small>(${esc(x.severity)}${x.detail?', '+esc(x.detail):''})</small><br>${esc(x.source)} → ${esc(x.target)}</div>`).join('');
  const amb=(t,x)=>x&&x.ambiguous?`<p><b>AMBIGUO</b> (texto ${esc(t)}): ${x.findings.map(f=>esc(f.field+': '+f.reason)).join('; ')}</p>`:'';
  $('out').innerHTML=`<div class="card"><div><span class="badge ${cls}">${label}</span></div>
  <p style="margin:10px 0 0">${esc(d.state_reason||'')}</p>
  ${rel||diffs?`<h3 style="margin:14px 0 4px;font-size:14px">Qué cambió</h3>${rel}${diffs}`:''}
  ${amb('A',d.ambiguity_a)}${amb('B',d.ambiguity_b)}${d.contradiction&&d.contradiction.contradiction?`<p><b>CONTRADICCIÓN</b>: ${d.contradiction.alerts.map(a=>esc(a.type)).join(', ')}</p>`:''}
  <details><summary>Detalle técnico</summary>
  <p><small>Similitud superficial (no es una prueba de equivalencia):</small> <b>${pct}%</b></p><div class="bar"><i style="width:${pct}%"></i></div>
  <div class="dims">${dims}</div>
  <pre>${esc(d.aixl_a||'')}\n${esc(d.aixl_b||'')}</pre></details></div>`;
}
$('go').onclick=run;
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')run()});
run();
</script></main></body></html>
