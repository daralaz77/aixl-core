version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init, analyze and upload-sarif must run the same version: update them in one pull request.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
