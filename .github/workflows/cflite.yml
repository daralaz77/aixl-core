name: clusterfuzzlite

# Coverage-guided fuzzing (Atheris / libFuzzer) of the semantic comparator and the translator: harnesses in fuzz/, build files in .clusterfuzzlite/.
# Pull requests: a short code-change run. Weekly + manual: a longer batch run. Any crash, hang or broken invariant fails the job and uploads the input.
on:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 120 || 300 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          report-unreproducible-crashes: false
          sanitizer: address
