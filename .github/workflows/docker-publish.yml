name: docker-publish

# Builds and publishes the aixl-core A2A agent image. Gated on the test suite passing first (the
# `tests` workflow) so a broken build never reaches ghcr.io — see DEPLOYMENT.md for the full pipeline.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (not pushed yet) and smoke-test it
        # Builds once, loads it into the local Docker daemon, and actually runs it — a real container,
        # a real HTTP round-trip (aixl_compare) — before anything is pushed. A Dockerfile that builds
        # does not mean the image works (found for real while building this pipeline: the first image
        # built fine and then crashed on start with `ModuleNotFoundError: uvicorn`, since
        # a2a-sdk[http-server] does not pull in an ASGI server by itself).
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: aixl-core:smoke-test
          load: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the smoke-tested image and verify a real round-trip
        run: |
          docker run -d --name smoke -p 8766:8766 \
            -e AIXL_A2A_PUBLIC_URL=http://127.0.0.1:8766/ aixl-core:smoke-test
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8766/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8766/healthz
          pip install -q "a2a-sdk[http-server]"
          python scripts/smoke_test_a2a.py http://127.0.0.1:8766
          docker logs smoke
          docker rm -f smoke

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
