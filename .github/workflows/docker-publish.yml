name: docker-publish

# Builds and publishes the aixl-core A2A agent image. Gated on the test suite passing first (the
# `tests` workflow) so a broken build never reaches ghcr.io — see DEPLOYMENT.md for the full pipeline.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    # Only a SUCCESSFUL run of `tests` triggered by a push to this repository's own main: a pull request (even from a fork whose branch is
    # also called main) never reaches the step that checks out code and writes packages (OpenSSF Scorecard 'dangerous workflow' finding).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (not pushed yet) and smoke-test it
        # Builds once, loads it into the local Docker daemon, and actually runs it — a real container,
        # a real HTTP round-trip (aixl_compare) — before anything is pushed. A Dockerfile that builds
        # does not mean the image works (found for real while building this pipeline: the first image
        # built fine and then crashed on start with `ModuleNotFoundError: uvicorn`, since
        # a2a-sdk[http-server] does not pull in an ASGI server by itself).
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: aixl-core:smoke-test
          load: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run the smoke-tested image and verify a real round-trip
        run: |
          # The agent refuses to listen on a public interface (the image binds 0.0.0.0) without AIXL_A2A_TOKEN. A token is generated for this run only.
          TOKEN=$(openssl rand -hex 16)
          echo "::add-mask::$TOKEN"
          docker run -d --name smoke -p 8766:8766 \
            -e AIXL_A2A_TOKEN=$TOKEN -e AIXL_A2A_PUBLIC_URL=http://127.0.0.1:8766/ aixl-core:smoke-test
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8766/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8766/healthz || { docker logs smoke; exit 1; }
          pip install -q "a2a-sdk[http-server]" httpx
          AIXL_A2A_TOKEN=$TOKEN python scripts/smoke_test_a2a.py http://127.0.0.1:8766 || { docker logs smoke; exit 1; }
          docker logs smoke
          docker rm -f smoke

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Pull the just-published image fresh and re-verify a real round-trip
        # Proves the full publish -> pull cycle actually works through the real registry with real
        # auth — ghcr.io/daralaz77/aixl-core is a PRIVATE package (package visibility is set separately from the repository's, which is public),
        # confirmed the hard way: an anonymous `docker pull` of it fails with "unauthorized", and even
        # an authenticated-but-under-scoped token gets a 403 — so `docker push` succeeding is NOT
        # sufficient evidence the image is actually retrievable. This also exercises the same kind of
        # authenticated access k8s/deployment.yaml's imagePullSecrets exists to provide to a real
        # cluster. Removing the local smoke-test image first forces a genuine registry round-trip,
        # not a same-tag local-cache hit.
        run: |
          docker rmi aixl-core:smoke-test || true
          docker pull ghcr.io/${{ github.repository }}:latest
          TOKEN2=$(openssl rand -hex 16)
          echo "::add-mask::$TOKEN2"
          docker run -d --name smoke2 -p 8767:8766 \
            -e PORT=8766 -e AIXL_A2A_TOKEN=$TOKEN2 -e AIXL_A2A_PUBLIC_URL=http://127.0.0.1:8767/ \
            ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8767/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8767/healthz || { docker logs smoke2; exit 1; }
          AIXL_A2A_TOKEN=$TOKEN2 python scripts/smoke_test_a2a.py http://127.0.0.1:8767 || { docker logs smoke2; exit 1; }
          docker logs smoke2
          docker rm -f smoke2
