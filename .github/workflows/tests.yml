name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # aixl itself is never pip-installed, in CI or locally (pyproject.toml has no package-discovery
        # config for this multi-top-level-dir layout, and `pip install -e .` fails on it) — pytest's own
        # `pythonpath = ["."]` (pyproject.toml) resolves imports straight from the checkout instead,
        # exactly like the project's documented dev setup (README.md: `pip install pytest tiktoken`).
        # uvicorn is listed explicitly even though `mcp` happens to pull it in transitively today (for
        # its own unrelated HTTP transport) — a2a-sdk[http-server] does NOT depend on an ASGI server by
        # itself (found by actually running the Docker image with only that extra installed: it crashed
        # with ModuleNotFoundError: uvicorn), so this step must not rely on that accidental coupling.
        # httpx is listed explicitly for the same reason as uvicorn above: a2a-sdk[http-server]
        # happens to pull it in transitively, but the llm-translator tests need it on their own merits
        # (aixl/translators/llm_translator.py, pyproject.toml's `llm` extra) and must not rely on that
        # accidental coupling either.
        run: pip install pytest tiktoken mcp "a2a-sdk[http-server]" uvicorn httpx

      - name: Run test suite
        run: pytest -q

      - name: Every `from aixl... import` in the repo still resolves
        run: python -m benchmarks.check_imports

  lint:
    # BLOCKING since 2026-10-13 (the baseline reached 0 on 2026-10-08; consejo-5x audit step 2). Rules are pinned in pyproject.toml
    # (F, E9, B, I). ruff itself is pinned too: an import-sorting rule changing between versions must not turn main red by itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check .

  arena:
    # Release gate from the audit decision (2026-10-13): the adversarial sweep must report ZERO defects in the layers that are published
    # (published compare, integrity envelope, gate). `selftest` first: an arena that cannot catch a planted bug proves nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m lab.arena.arena selftest
      - run: python -m lab.arena.arena scope
